name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/NfcHider-v*.apk artifacts/
          rm -f artifacts/*-release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NfcHider-${{ github.run_number }}
          path: artifacts/


      - name: Package source code (all files)
        run: |
          # 打包当前目录所有文件（不包括输出文件自身）
          mkdir -p artifacts
          zip -r artifacts/NfcHider-source.zip . -x 'artifacts/NfcHider-source.zip'
          echo "All files packaged (including hidden files)"
      
      
      # 删除旧的 Actions 运行历史（保留最近 1 次）
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
      
      # 删除所有旧的 Release
      - name: Delete all old Releases
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' |
          while read tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes || true
            git push --delete origin "$tag" 2>/dev/null || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 创建新的 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
