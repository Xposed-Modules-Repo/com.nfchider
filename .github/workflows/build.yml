name: Build

on:
  # 仅手动触发构建，避免每次推送代码都创建新版本
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 固定发布标识：Release 名、tag、APK 文件名全部使用 1-1.1。
# 每次构建先删除旧的 1-1.1 Release 与 tag，再新建同名发布，实现「覆盖式」发布。
env:
  TAG: 1-1.1
  APK: NfcHider-1-1.1.apk

# 同一分支只允许一个构建实例运行：连续手动触发时排队而非并发，
# 避免两个实例同时删/建 Release 与标签造成竞态冲突。
# cancel-in-progress=false：排队执行，不取消已在跑的构建（发布链路需完整跑完）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          set -e
          mkdir -p artifacts
          # archivesName 由固定的 versionCode/versionName 生成 NfcHider-1-1.1.apk，
          # 这里无论产物原名如何，都显式归一到固定 APK 名，避免与 TAG 错位。
          cp app/build/outputs/apk/release/NfcHider-*.apk "artifacts/${APK}"
          ls -la artifacts/
          test -s "artifacts/${APK}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NfcHider-${{ github.run_number }}
          path: artifacts/

      - name: Package source code (all files)
        run: |
          mkdir -p artifacts
          zip -r artifacts/NfcHider-source.zip . -x 'artifacts/NfcHider-source.zip'
          echo "All files packaged (including hidden files)"

      # 删除旧的 Actions 运行历史（保留最近 1 次）
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      # 删除两个仓库里旧的 1-1.1 Release 与同名 tag，随后重建。
      # 用 REST API 而非 gh release delete：后者不会删除 tag，且不存在时会报错；
      # 这里对「不存在」按成功处理，保证首次/重复运行都幂等。
      - name: Delete old 1-1.1 release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          set -e
          delete_one() {
            local token="$1" repo="$2"
            echo "--- cleaning ${repo}@${TAG} ---"
            # 1. 删除 Release（若存在）；GitHub 不会自动删对应 tag。
            #    先拿 HTTP 状态码 + body，404 视为「本来就没有」而非错误，
            #    避免 grep 无匹配时被 set -e 误杀（首次构建必现）。
            resp=$(mktemp)
            http=$(curl -sS -o "${resp}" -w "%{http_code}" \
              -H "Authorization: token ${token}" \
              "https://api.github.com/repos/${repo}/releases/tags/${TAG}")
            if [ "${http}" = "200" ]; then
              rel_id=$(jq -r '.id' "${resp}")
              if [ -n "${rel_id}" ] && [ "${rel_id}" != "null" ]; then
                del=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: token ${token}" \
                  "https://api.github.com/repos/${repo}/releases/${rel_id}")
                echo "release delete: ${del}"
                case "${del}" in 204|404) ;; *) echo "::error::删除 Release 失败 (HTTP ${del})"; rm -f "${resp}"; return 1 ;; esac
              fi
            else
              echo "no release to delete (HTTP ${http})"
            fi
            rm -f "${resp}"
            # 2. 删除同名 tag（若存在），对「不存在」按成功处理。
            status=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: token ${token}" \
              "https://api.github.com/repos/${repo}/git/refs/tags/${TAG}")
            echo "tag delete: ${status}"
            case "${status}" in
              204|404|422) ;;  # 已删除 / 本来不存在 -> 幂等成功
              *) echo "::error::删除 ${repo} tag ${TAG} 失败 (HTTP ${status})"; return 1 ;;
            esac
          }
          delete_one "${GITHUB_TOKEN}" "${{ github.repository }}"
          if [ -n "${XPOSED_REPO_TOKEN}" ]; then
            delete_one "${XPOSED_REPO_TOKEN}" "Xposed-Modules-Repo/com.nfchider"
          else
            echo "::warning::未配置 XPOSED_REPO_TOKEN，跳过组织仓库清理"
          fi

      # 按固定的 1-1.1 新建 Release（tag 不存在，softprops 会同时创建 tag 与 Release）
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: artifacts/${{ env.APK }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Xposed-Modules-Repo/com.nfchider 是发布镜像仓库：代码平时只在个人仓库
      # （furina707/com.nfchider）更新，由本仓库 CI 代为同步：
      # 1. 全量同步代码：个人仓库完整源码树 -> 组织仓库（普通提交推进，保留历史）
      # 2. 在组织仓库创建同名 1-1.1 Release 并附上 APK（旧的已在上方清理步骤删除）
      # 需要在本仓库 Settings > Secrets 中配置 XPOSED_REPO_TOKEN（有该仓库写权限的 PAT）
      - name: Sync to Xposed-Modules-Repo
        if: success()
        env:
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          set -e
          REPO="Xposed-Modules-Repo/com.nfchider"

          # 1. 全量同步代码。
          #    --delete 保证组织仓库不残留个人仓库已删除的文件，实现真正镜像；
          #    排除 .git 与构建/临时产物；不用 force push，保留组织仓库提交历史。
          git clone --depth 1 "https://x-access-token:${XPOSED_REPO_TOKEN}@github.com/${REPO}.git" /tmp/xposed-repo
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='artifacts/' \
            --exclude='build/' \
            --exclude='app/build/' \
            --exclude='.gradle/' \
            --exclude='local.properties' \
            "${GITHUB_WORKSPACE}/" /tmp/xposed-repo/
          cd /tmp/xposed-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "代码无变化，跳过同步提交"
          else
            git commit -m "sync: ${TAG}"
            git push
          fi

          # 2. 在 Xposed-Modules-Repo 创建 1-1.1 Release 并上传 APK。
          cd "${GITHUB_WORKSPACE}"
          http=$(curl -sS -o /tmp/release.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${XPOSED_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false,\"make_latest\":true}")
          if [ "${http}" != "201" ]; then
            echo "::error::创建组织仓库 Release 失败 (HTTP ${http})"; cat /tmp/release.json; exit 1
          fi

          UPLOAD_URL=$(grep -oP '"upload_url":\s*"\K[^"]+' /tmp/release.json | sed 's/{?name,label}//')
          curl -sS -X POST \
            -H "Authorization: token ${XPOSED_REPO_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=${APK}" \
            --data-binary @"artifacts/${APK}" \
            -o /dev/null
          echo "已同步到 Xposed-Modules-Repo: ${TAG}"
